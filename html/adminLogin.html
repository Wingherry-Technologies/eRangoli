<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Login</title>
    <link rel="stylesheet" href="../css/adminLogin.css" />
  </head>
  <body>
    <div class="login-wrapper">
      <!-- LEFT PANEL -->
      <div class="left-panel">
        <img src="../assets/adminLogin/eRangoli-logo.svg" class="logo-svg" />
        <img src="../assets/adminLogin/eRangoli-name.svg" class="brand-svg" />
      </div>

      <!-- RIGHT PANEL -->
      <div class="right-panel">
        <!-- TOP WAVES -->
        <div class="top-waves">
          <img src="../assets/adminLogin/curve-1.svg" />
          <img src="../assets/adminLogin/curve-2.svg" />
          <img src="../assets/adminLogin/curve-3.svg" />
          <img src="../assets/adminLogin/curve-4.svg" />
        </div>
        <!-- LOGIN FORM -->
        <div class="form-box" id="loginBox">
          <h2>Login</h2>

          <label>Username</label>
          <input
            type="text"
            id="username"
            placeholder="Rutuja"
            autocomplete="off"
          />

          <label>Password</label>
          <input type="password" placeholder="ty@jjfj67" />

          <a href="#" class="forgot" id="forgotBtn">Forgot Password</a>

          <button class="sign-up">Sign Up</button>

          <p class="register">Register Here</p>
        </div>

        <!-- RESET PASSWORD -->
        <div class="form-box reset hidden" id="resetBox">
          <h2>Reset Password</h2>

          <p class="info">
            Please enter your registered Email address to reset your password
          </p>

          <label>Email Address</label>
          <input
            type="email"
            id="email"
            placeholder="davidjohn23@gmail.com"
            autocomplete="off"
          />
          <p class="error" id="emailError"></p>

          <button class="request-link">Request reset link</button>

          <p class="back" id="backToLogin">Back to login</p>
        </div>
      </div>
    </div>
  </body>
  <script src="../javascript/adminLogin.js"></script>
</html>
