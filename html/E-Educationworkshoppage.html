<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Workshop Mobile UI</title>

  <link rel="stylesheet" href="../css/e-educationworkshoppage.css" />
</head>

<body>

  <div class="WS-container">

            <img src="https://i.pravatar.cc/100?img=1" />

            <span class="WS-title">
              Pottery Making
            </span>

          </div>

          <div class="WS-right">

            <label class="WS-switch">

              <input type="checkbox" checked />

              <span class="WS-slider"></span>

            </label>

          </div>

        </div>

      </div>



      <!-- ACTIVE ITEM -->
