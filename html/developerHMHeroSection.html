<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Developer HM Hero Section</title>
    <link rel="stylesheet" href="../css/developerHMHeroSection.css" />
    <link
      rel="shortcut icon"
      href="../assets/master/eRangoli 2-1.svg"
      type="image/x-icon"
    />
  </head>
  <body>
    <div class="DHMHSpage-wrapper">
      <div class="DHMHScard">
        <div class="DHMHScard-header">
          <h2>Hero Section</h2>
        </div>

        <div class="DHMHScontent">
          <div class="DHMHSsection-row">
            <span class="DHMHSlabel">Core Content</span>

            <div>
              <button
                class="DHMHSpublish-btn"
                id="DHMHSpublishHeroBtn"
                style="display: none"
              >
                Publish
              </button>
              <button class="DHMHSedit-btn" id="DHMHSeditHeroBtn">Edit</button>
            </div>
          </div>

          <div id="DHMHSeditMode" style="display: none">
            <div class="DHMHSform-group">
              <label>Heading</label>
              <input
                type="text"
                id="DHMHSheroHeading"
                placeholder="Experience India’s Colours, Textures & Traditions."
              />
              <span class="DHMHSerror-message"></span>
            </div>

            <div class="DHMHSform-group">
              <label>Sub Text</label>
              <input
                type="text"
                id="DHMHSheroSubText"
                placeholder="Welcome to the world of craft uniquely Indian, handmade & Sustainable."
              />
              <span class="DHMHSerror-message"></span>
            </div>

            <div class="DHMHSform-group">
              <label>CTA Link</label>
              <input
                type="text"
                id="DHMHSheroCta"
                placeholder="https://store.example.com/collection/products"
              />
              <span class="DHMHSerror-message"></span>
            </div>
          </div>

          <!-- VIEW MODE -->
          <div id="DHMHSviewMode">
            <div class="DHMHSfield-block">
              <div class="DHMHSfield-label">Heading</div>
              <div class="DHMHSfield-value" id="DHMHSviewHeading"></div>
            </div>

            <div class="DHMHSfield-block">
              <div class="DHMHSfield-label">Sub Text</div>
              <div class="DHMHSfield-value" id="DHMHSviewSubText"></div>
            </div>

            <div class="DHMHSfield-block">
              <div class="DHMHSfield-label">CTA Link</div>
              <div class="DHMHSfield-value" id="DHMHSviewCta"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- ── Card 2: Hero Images ── -->
      <div class="DHMHSimages-card">
        <div class="DHMHSimages-header">
          <div class="DHMHSimages-title">
            <h3>Hero Images</h3>
            <span>(Minimum 3 images or videos)</span>
          </div>
          <button class="DHMHSpublish-btn">Publish</button>
        </div>

        <div class="DHMHSimage-grid">
          <div class="DHMHSimg-tile-wrapper">
            <div class="DHMHSimg-tile" id="DHMHStile1">
              <img
                src="../assets/developerHMHeroSection/img-1.jpg"
                alt="Weaving loom"
              />
              <span
                class="DHMHStile-menu-btn"
                onclick="DHMHStoggleDropdown('DHMHSdd1')"
              >
                <img src="../assets/developerHMHeroSection/3dot.svg" />
              </span>
              <div class="DHMHStile-dropdown" id="DHMHSdd1">
                <button class="DHMHSdelete">Delete</button>

                <button>Upload</button>
              </div>
            </div>
            <div class="DHMHSimg-caption">Recommended size: 1920px 1080px</div>
          </div>

          <div class="DHMHSimg-tile-wrapper">
            <div class="DHMHSimg-tile" id="DHMHStile2">
              <img
                src="../assets/developerHMHeroSection/img-3.png"
                alt="Craft painting"
              />
              <span
                class="DHMHStile-menu-btn"
                onclick="DHMHStoggleDropdown('DHMHSdd2')"
              >
                <img src="../assets/developerHMHeroSection/3dot.svg" />
              </span>
              <div class="DHMHStile-dropdown" id="DHMHSdd2">
                <button class="DHMHSdelete">Delete</button>
                <button>Upload</button>
              </div>
            </div>
          </div>

          <div class="DHMHSimg-tile-wrapper">
            <div class="DHMHSimg-tile" id="DHMHStile3">
              <img
                src="../assets/developerHMHeroSection/img-2.png"
                alt="Craft painting"
              />
              <span
                class="DHMHStile-menu-btn"
                onclick="DHMHStoggleDropdown('DHMHSdd3')"
              >
                <img src="../assets/developerHMHeroSection/3dot.svg" />
              </span>
              <div class="DHMHStile-dropdown" id="DHMHSdd3">
                <button class="DHMHSdelete">Delete</button>
                <button>Upload</button>
              </div>
            </div>
          </div>

          <div class="DHMHSimg-tile-wrapper">
            <div class="DHMHSadd-tile">
              <div class="DHMHSadd-icon">+</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="../javascript/developerHMHeroSection.js"></script>
  </body>
</html>
