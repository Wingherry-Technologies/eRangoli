 @import url("https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Padauk:wght@400;700&display=swap");

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: "Nunito Sans";
}

body{
    background:#edf0f5;
    padding:14px;
}

/* ================= MAIN ================= */

.main-container{
    width:100%;
    background:#fff;
    border-radius:8px;
    padding:18px;
}

/* ================= HEADER ================= */

.top-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:22px;
    position:sticky;
    top:0;
    background:#fff;
    z-index:100;
    padding-bottom:12px;
}

.page-title{
    font-size:30px;
    font-weight:700;
    color:#222;
}

.publish-btn{
    min-width:120px;
    height:42px;
    border:none;
    border-radius:5px;
    background:#1f8fff;
    color:#fff;
    font-size:15px;
    cursor:pointer;
}

.publish-btn:hover{
    background:#0d7ceb;
}

/* ================= LAYOUT ================= */

.content-layout{
    display:flex;
    gap:22px;
    align-items:flex-start;
}

/* ================= LEFT SIDE ================= */

.left-panel{
    width:34%;
}

.preview-image{
    width:100%;
    border-radius:4px;
    overflow:hidden;
    margin-bottom:14px;
}

.preview-image img{
    width:100%;
    display:block;
}

/* ================= RIGHT SIDE ================= */

.right-panel{
    flex:1;
}

/* ================= TOP DETAILS ================= */

.top-details{
    display:flex;
    gap:22px;
    align-items:flex-start;
    margin-bottom:30px;
}

.artisan-photo{
    width:160px;
    min-width:120px;
    height:150px;
    background:#d8d8d8;
    border-radius:4px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#555;
    position:relative;
    overflow:hidden;
}

.artisan-photo input{
    display:none;
}

.artisan-photo label{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:10px;
}

.artisan-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.details-content{
    flex:1;
}

.info-row{
    margin-bottom:18px;
}

.info-title{
    font-size:14px;
    font-weight:700;
    margin-bottom:6px;
    color:#333;
}

.info-input{
    width:100%;
    border:1px solid #dcdcdc;
    /* border: none; */
    border-radius:4px;
    padding:10px 8px;
    font-size:14px;
    outline:none;
}

.text-area{
    width:100%;
    border:1px solid #dcdcdc;
    border-radius:4px;
    padding:12px;
    min-height:120px;
    resize:none;
    outline:none;
    line-height:1.8;
}

/* ================= SECTION ================= */

.section-block{
    margin-bottom:34px;
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.section-title{
    font-size:15px;
    font-weight:700;
    color:#333;
}

.edit-icon{
    width:14px;
    cursor:pointer;
}

.line{
    width:100%;
    height:1px;
    background:#d8d8d8;
    margin:20px 0;
}

/* ================= IMAGE GRID ================= */

.image-grid-large{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-top:18px;
}

.image-grid-large .big{
    grid-column:1 / -1;
    min-height:220px;
}

.image-grid-medium{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-top:18px;
}

.image-grid-bottom{
    display:grid;
    grid-template-columns:2fr 1fr 1fr;
    gap:14px;
    margin-top:20px;
}

.image-box{
    min-height:160px;
    background:#d9d9d9;
    border-radius:4px;
    overflow:hidden;
    position:relative;
}

.image-box.big{
    min-height:230px;
}

.image-box label{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    cursor:pointer;
    color:#555;
    padding:12px;
}

.image-box input{
    display:none;
}

.image-box img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.delete-btn{
    position:absolute;
    top:10px;
    right:10px;
    width:30px;
    height:30px;
    border:none;
    border-radius:50%;
    background:red;
    color:#fff;
    cursor:pointer;
    display:none;
}

.image-box.has-image .delete-btn{
    display:block;
}

/* ================= FOOTER BUTTON ================= */

.footer-btn button{

    height:44px;
    border:none;
    border-radius:5px;

    color:#fff;
    font-size:15px;
    cursor:pointer;
}

/* ================= VALIDATION ================= */

.input-error{
    border:1px solid red !important;

<script>

/* ================= IMAGE PREVIEW ================= */

function previewImage(event, boxId){

    const file = event.target.files[0];

    if(!file) return;

    const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/webp",
        "image/jpg"
    ];

    if(!allowedTypes.includes(file.type)){

        alert("Only JPG, PNG, WEBP allowed");

        return;
    }

    if(file.size > 5 * 1024 * 1024){

        alert("Image size must be below 5MB");

        return;
    }

    const box = document.getElementById(boxId);

    const reader = new FileReader();

    reader.onload = function(e){

        box.classList.add("has-image");

        box.innerHTML = `

            <img src="${e.target.result}">

            <button class="delete-btn"
                    onclick="deleteImage('${boxId}')">
                ×
            </button>

            <input type="file"
                   accept="image/*"
                   style="display:none"
                   onchange="previewImage(event,'${boxId}')">

        `;

    }

    reader.readAsDataURL(file);

}

/* ================= DELETE IMAGE ================= */

function deleteImage(boxId){

    const box = document.getElementById(boxId);

    box.classList.remove("has-image");

    box.innerHTML = `

        <label>

            Upload Image

            <input type="file"
                   accept="image/*"
                   onchange="previewImage(event,'${boxId}')">

        </label>

        <button class="delete-btn"
                onclick="deleteImage('${boxId}')">
            ×
        </button>

    `;

}

/* ================= VALIDATION ================= */

function publishPage(){

    let valid = true;

    const fields =
        document.querySelectorAll(".required-field");

    fields.forEach(field => {

        field.classList.remove("input-error");

        if(field.value.trim() === ""){

            valid = false;

            field.classList.add("input-error");

        }

    });

    if(!valid){

        alert("Please fill all required fields");

        return;

    }

    const uploadedImages =
        document.querySelectorAll(".has-image");

    if(uploadedImages.length === 0){

        alert("Please upload at least one image");

        return;

    }

    alert("Published Successfully");

}

</script>
