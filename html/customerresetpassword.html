<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/customerresetpassword.css">
<link rel="shortcut icon" href="../assets/master/eRangoli 2-1.svg" type="image/x-icon">

</head>
<body>

<div class="bg"></div>

<!-- Card -->
<div class="card" id="card">
  <div class="card-header">
    <h1 class="card-title">Reset Password</h1>
    <p class="card-subtitle">
      The password is being reset for account<br>
      <strong id="account-email">david.john@gmail.com</strong>
    </p>
  </div>

  <!-- <div class="divider"><span class="divider-icon">✦</span></div> -->

  <form id="resetForm" novalidate>

    <div class="form-group">
      <label for="newPassword">New password <span class="required">*</span></label>
      <div class="input-wrap">
        <input type="password" id="newPassword" placeholder="Enter new password" autocomplete="new-password">
        <button type="button" class="eye-toggle" id="toggleNew" aria-label="Show password">
          <svg id="eyeNewOpen" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg id="eyeNewClosed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
      <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
      <div class="pw-rules" id="pwRules">
        <div class="rule" id="rule-len">
          <i class="rule-icon"></i>8 characters minimum
        </div>
        <div class="rule" id="rule-upper">
          <i class="rule-icon"></i>One uppercase letter
        </div>
        <div class="rule" id="rule-lower">
          <i class="rule-icon"></i>One lowercase letter
        </div>
        <div class="rule" id="rule-num">
          <i class="rule-icon"></i>One number
        </div>
        <div class="rule" id="rule-special">
          <i class="rule-icon"></i>One special character
        </div>
      </div>
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirm new password <span class="required">*</span></label>
      <div class="input-wrap">
        <input type="password" id="confirmPassword" placeholder="••••••••••" autocomplete="new-password">
        <button type="button" class="eye-toggle" id="toggleConfirm" aria-label="Show confirm password">
          <svg id="eyeConfOpen" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg id="eyeConfClosed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
      <div class="match-msg" id="matchMsg"></div>
    </div>

    <button type="submit" class="btn-reset" id="submitBtn">Reset Password</button>
  </form>
</div>

<!-- Success Overlay -->
<div class="success-overlay" id="successOverlay">
  <div class="success-box">
    <div class="check-circle">
      <svg viewBox="0 0 90 90">
        <circle class="circle-bg" cx="45" cy="45" r="40"/>
        <circle class="circle-anim" cx="45" cy="45" r="40" transform="rotate(-90 45 45)"/>
        <polyline class="check-mark" points="27,46 39,58 63,32"/>
      </svg>
    </div>
    <h2 class="success-title">Password Reset!</h2>
    <p class="success-msg">Your password has been updated successfully.<br>Redirecting you to login…</p>
    <div class="redirect-bar"><div class="redirect-fill" id="redirectFill"></div></div>
    <p class="redirect-text">Redirecting in 3 seconds</p>
  </div>
</div>

<div class="particles" id="particles"></div>

<script src="../javascript/customerresetpassword.js"></script>
</body>
</html>
