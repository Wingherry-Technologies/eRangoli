<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Developer HM Featured Brands Add New</title>
    <link rel="stylesheet" href="../css/developerHMFeatureBrandsAddNew.css" />
    <link
      rel="shortcut icon"
      href="../assets/master/eRangoli 2-1.svg"
      type="image/x-icon"
    />
  </head>
  <body>
    <div class="DHMFBANadd-brand-mobile">
      <div class="DHMFBANadd-brand-header">
        <h3>Add new brand</h3>
      </div>

      <div class="DHMFBANadd-brand-mob-body">
        <div class="DHMFBANadd-brand-mob-header">
          <h3>Add new brand</h3>
        </div>
        <label>Select the Vendor</label>
        <select class="DHMFBANvendorSelect">
          <option>Sanskriti Collections</option>
        </select>

        <label>Enter Brand Name</label>
        <input
          type="text"
          placeholder="Craftizen"
          class="DHMFBANbrandNameInput"
        />

        <label>Upload Brand Logo</label>

        <div class="DHMFBANupload-box-mob" id="DHMFBANuploadBoxMob">
          <input type="file" id="DHMFBANbrandLogoMob" accept="image/*" hidden />

          <img
            id="DHMFBANbrandPreviewMob"
            style="display: none; width: 100%; height: 100%; object-fit: cover"
          />

          <span class="DHMFBANplus" id="DHMFBANuploadPlusMob">
            <img src="../assets/developerHMFeatureBrands/camera.svg" />
          </span>
        </div>
        <div class="DHMFBANadd-brand-mob-footer">
          <button class="DHMFBANprimary-btn-mob">Publish & Next</button>
          <button class="DHMFBANoutline-btn-mob">Publish & Close</button>
        </div>
      </div>
    </div>
    <script src="../javascript/developerHMFeatureBrandsAddNew.js"></script>
  </body>
</html>
