<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift Workshop</title>
    <link rel="stylesheet" href="../css/E-Educationmygifts.css">
</head>

<body>

    <div class="mygiftbx">
        <div class="backtosearch">
            <div class="back-search">
                <span class="back-icon"><img src="../assets/E-EducationPhotoGallery/back.png" alt=""></span>
                <span class="back-text">Back to search</span>
            </div>
        </div>
        <div class="workshop-container">

            <h2 class="title">Gift Workshop</h2>

            <p class="subtitle">
                Threads of Tradition: Frame Loom Weaving with Master Artisans
            </p>

            <p class="section-title">
                Enter the details of the person attending workshop
            </p>

            <form id="workshopForm">

                <div class="form-group">
                    <label>Enter Name</label>
                    <input type="text" id="name" placeholder="Radhika Jain">
                    <span class="error" id="nameError"></span>
                </div>

                <div class="form-group">
                    <label>Enter Mobile Number</label>
                    <input type="tel" id="mobile" placeholder="7889578990" maxlength="10">
                    <span class="error" id="mobileError"></span>
                </div>

                <div class="form-group">
                    <label>Enter email address</label>
                    <input type="email" id="email" placeholder="radhikajain23@gmail.com">
                    <span class="error" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label>Enter message</label>
                    <textarea id="message" rows="1" placeholder="Wish you happy birthday and best wishes."></textarea>
                    <span class="error" id="messageError"></span>
                </div>

                <p class="note">
                    All the details and credentials will be send on the above mentioned email address and number phone
                </p>

                <div class="subbtn">
                    <button type="submit" class="submit-btn">
                        Proceed
                    </button>
                </div>

            </form>

        </div>
    </div>

    <script src="../javascript/E-Educationmygifts.js"></script>

</body>

</html>
