<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Registration</title>
  <link rel="stylesheet" href="../css/adminRegistration.css" />
      <link rel="shortcut icon" href="../assets/master/eRangoli 2-1.svg" type="image/x-icon">

</head>
<body>

<div class="adminRegistration-wrapper">

  <!-- LEFT PANEL -->
  <div class="adminRegistration-left-panel">
    <img src="../assets/adminRegistration/eRangoli 3.svg" class="adminRegistration-logo-svg" />
    <img src="../assets/adminRegistration/logoText.svg" class="adminRegistration-brand-svg" />
  </div>

  <!-- RIGHT PANEL -->
  <div class="adminRegistration-right-panel">

    <!-- TOP WAVES -->
    <div class="adminRegistration-top-waves">
        <img src="../assets/adminRegistration/Vector 13.svg" />
        <img src="../assets/adminRegistration/Vector 14.svg" />
        <img src="../assets/adminRegistration/Vector 17.svg" />
        <img src="../assets/adminRegistration/Vector 16.svg" />
    </div>

    <!-- REGISTRATION FORM -->
    <div class="adminRegistration-form-box" id="adminRegistrationBox">

      <h2>Register</h2>

      <label>Username</label>
      <input
        type="text"
        id="adminRegistrationUsername"
        placeholder="Rutuja"
        autocomplete="off"
      />
      <div class="adminRegistration-error" id="usernameError"></div>

      <label>Email Address</label>
      <input
        type="email"
        id="adminRegistrationEmail"
        placeholder="rutuja@gmail.com"
        autocomplete="off"
      />
      <div class="adminRegistration-error" id="emailError"></div>

      <label>Create Password</label>
      <input
        type="password"
        id="adminRegistrationPassword"
        placeholder="ty@jjfj67"
      />
      <div class="adminRegistration-error" id="passwordError"></div>

      <label>Re-enter Password</label>
      <input
        type="password"
        id="adminRegistrationConfirmPassword"
        placeholder="ty@jjfj67"
      />
      <div class="adminRegistration-error" id="confirmPasswordError"></div>

      <button class="adminRegistration-create-btn">Create</button>

    </div>


    <div class="adminRegistration-success adminRegistration-hidden" id="adminRegistrationSuccessBox">
  <div class="adminRegistration-success-icon"><img src="../assets/adminRegistration/success.svg" alt=""></div>
  <p>New user successfully created</p>
</div>


  </div>
</div>


<script src="../javascript/adminRegistration.js"></script>
</body>


</html>
