<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Padauk:wght@400;700&display=swap");

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Nunito Sans";
}


/* MAIN CARD */
.ref-card {
  display: flex;
  align-items: center;
  gap: 12px;
  background: #ffffff;
  border-radius: 12px;
  padding: 14px;
  max-width: 720px;
  width: 100%;
  border: 1px solid black;
}

/* LEFT IMAGE */
.ref-image img {
  max-width: 220px;
  width: 100%;
  height: 110px;
  object-fit: cover;
  border-radius: 8px;
  flex-shrink: 0;
}

/* RIGHT CONTENT */
.ref-content {
  flex: 1;
}

/* TITLE */
.ref-title {
  margin: 0 0 8px;
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
}

/* CODE + SHARE */
.ref-action {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 6px;
}

.ref-code {
  padding: 5px 10px;
  border: 1px solid #ddd;
  border-radius: 8px;
  background: #fff;
  font-weight: 500;
  white-space: nowrap;
  font-size: 14px;
}

/* SHARE BUTTON */
.ref-share-btn {
  padding: 6px 10px;
  border: none;
  border-radius: 8px;
  background: #f2e2e2;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
    font-size: 14px;

}

/* DESCRIPTION */
.ref-desc {
  margin: 0;
  font-size: 12px;
  color: #666;
}

/* 🔒 FORCE ROW ON ALL SCREENS */
@media (max-width: 640px) {
  .ref-card {
    flex-direction: row; /* stays row */
  }

  .ref-image img {
    max-width: 100px;
    width: 100%;
    max-height: 70px;
  }

  .ref-title {
    font-size: 16px;
  }

  .ref-desc {
    font-size: 13px;
  }
}

  </style>
</head>
<body>


  <div class="ref-card">
    <!-- LEFT IMAGE -->
    <div class="ref-image">
            <h3 class="ref-title">Referral Code</h3>

      <img src="../assets/Coupons/refcodeimg.png" alt="Referral Illustration">
    </div>

    <!-- RIGHT CONTENT -->
    <div class="ref-content">

      <div class="ref-action">
        <div class="ref-code">Referral 20</div>
        <button class="ref-share-btn">Share</button>
      </div>

      <p class="ref-desc">
        For instant discount Refer your friends and family
      </p>
    </div>
  </div>

</body>
</html>

</body>
</html>
