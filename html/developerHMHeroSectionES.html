<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Developer HM Hero Section Empty State</title>
    <link rel="stylesheet" href="../css/developerHMHeroSectionES.css" />
    <link
      rel="shortcut icon"
      href="../assets/master/eRangoli 2-1.svg"
      type="image/x-icon"
    />
  </head>
  <body>
    <div class="DHMHSEScontainer">
      <!-- HERO SECTION -->
      <div class="DHMHSEScard">
        <div class="DHMHSEScard-header">
          <h2>Hero Section</h2>
        </div>

        <div class="DHMHSEScard-body">
          <div class="DHMHSESsection-top">
            <h3>Core Content</h3>
            <button class="DHMHSESpublish-btn">Publish</button>
          </div>

          <div class="DHMHSESform-group">
            <label>Heading</label>
            <input
              type="text"
              id="DHMHSESheroHeading"
              placeholder="Experience India’s Colours, Textures & Traditions."
            />
            <span class="DHMHSESerror-message"></span>
          </div>

          <div class="DHMHSESform-group">
            <label>Sub Text</label>
            <input
              type="text"
              id="DHMHSESheroSubText"
              placeholder="Welcome to the world of craft uniquely Indian, handmade & Sustainable."
            />
            <span class="DHMHSESerror-message"></span>
          </div>

          <div class="DHMHSESform-group">
            <label>CTA Link</label>
            <input
              type="text"
              id="DHMHSESheroCta"
              placeholder="https://store.example.com/collection/products"
            />
            <span class="DHMHSESerror-message"></span>
          </div>

          <button class="DHMHSESpublish-btn-mob">Publish</button>
        </div>
      </div>

      <!-- HERO IMAGES -->
      <div class="DHMHSEScard">
        <div class="DHMHSESsection-top">
          <h3>Hero Images <span>(Minimum 3 images or videos)</span></h3>
          <button class="DHMHSESpublish-btn">Publish</button>
        </div>

        <div class="DHMHSESupload-wrapper">
          <!-- Upload Box -->
          <div class="DHMHSESupload-box">
            <div class="DHMHSESupload-icon">
              <img
                src="../assets/developerHMHeroSectionES/upload.svg"
                alt="upload"
              />
            </div>
            <p>Upload Cover Image or<br />drag & drop</p>
          </div>
          <small class="DHMHSESsmall-text-mob"
            >Recommended size : 1920px 1080px</small
          >

          <!-- Add Media Box -->
          <div class="DHMHSESupload-box DHMHSESadd-media-box">
            <div class="DHMHSESplus-icon" id="DHMHSESopenMediaPopup">+</div>

            <!-- Popup -->
            <div class="DHMHSESmedia-popup" id="DHMHSESmediaPopup">
              <button class="DHMHSESmedia-option">Image</button>
              <button class="DHMHSESmedia-option">Video</button>
            </div>
          </div>
        </div>
        <small class="DHMHSESsmall-text"
          >Recommended size : 1920px 1080px</small
        >
        <button class="DHMHSESpublish-btn-mob">Publish</button>
      </div>
    </div>
    <script src="../javascript/developerHMHeroSectionES.js"></script>
  </body>
</html>
