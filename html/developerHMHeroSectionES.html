<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Developer HM Hero Section Empty State</title>
    <link rel="stylesheet" href="../css/developerHMHeroSectionES.css" />
    <link
      rel="shortcut icon"
      href="../assets/master/eRangoli 2-1.svg"
      type="image/x-icon"
    />
  </head>
  <body>
    <div class="container">
      <!-- HERO SECTION -->
      <div class="card">
        <div class="card-header">
          <h2>Hero Section</h2>
        </div>

        <div class="card-body">
          <div class="section-top">
            <h3>Core Content</h3>
            <button class="publish-btn">Publish</button>
          </div>

          <div class="form-group">
            <label>Heading</label>
            <input
              type="text"
              id="heroHeading"
              placeholder="Experience India’s Colours, Textures & Traditions."
            />
            <span class="error-message"></span>
          </div>

          <div class="form-group">
            <label>Sub Text</label>
            <input
              type="text"
              id="heroSubText"
              placeholder="Welcome to the world of craft uniquely Indian, handmade & Sustainable."
            />
            <span class="error-message"></span>
          </div>

          <div class="form-group">
            <label>CTA Link</label>
            <input
              type="text"
              id="heroCta"
              placeholder="https://store.example.com/collection/products"
            />
            <span class="error-message"></span>
          </div>

          <button class="publish-btn-mob">Publish</button>
        </div>
      </div>

      <!-- HERO IMAGES -->
      <div class="card">
        <div class="section-top">
          <h3>Hero Images <span>(Minimum 3 images or videos)</span></h3>
          <button class="publish-btn">Publish</button>
        </div>

        <div class="upload-wrapper">
          <!-- Upload Box -->
          <div class="upload-box">
            <div class="upload-icon">
              <img
                src="../assets/developerHMHeroSectionES/upload.svg"
                alt="upload"
              />
            </div>
            <p>Upload Cover Image or<br />drag & drop</p>
          </div>
          <small class="small-text-mob">Recommended size : 1920px 1080px</small>

          <!-- Add Media Box -->
          <div class="upload-box add-media-box">
            <div class="plus-icon" id="openMediaPopup">+</div>

            <!-- Popup -->
            <div class="media-popup" id="mediaPopup">
              <button class="media-option">Image</button>
              <button class="media-option">Video</button>
            </div>
          </div>
        </div>
        <small class="small-text">Recommended size : 1920px 1080px</small>
        <button class="publish-btn-mob">Publish</button>
      </div>
    </div>
    <script src="../javascript/developerHMHeroSectionES.js"></script>
  </body>
</html>
