<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eRangoli Ticket</title>
    <link rel="stylesheet" href="../css/E-EducationMTicket.css" />
  </head>
  <body>
    <p class="page-title">M- Ticket</p>

    <div class="ticket-wrapper">
      <!-- SVG backgrounds -->
      <div class="ticket-left"></div>
      <div class="ticket-right"></div>

      <!-- ── LEFT CONTENT ── -->
      <div class="left-content">
        <!-- Mandala placeholder (replace src with actual asset path) -->
        <div class="mandala-logo">
          <img src="../assets/EMT/eRangoli 3 (1).svg" alt="eRangoli Logo" />
        </div>

        <div class="ticket-number">#456</div>
      </div>

      <!-- ── RIGHT CONTENT ── -->
      <div class="right-content">
        <div class="perforation"></div>

        <div class="right-body">
          <!-- Text column -->
          <div class="text-col">
            <div class="event-title">
              Threads of Tradition: Frame Loom Weaving<br />with Master Artisans
            </div>
            <div class="venue-block">
              <div class="venue-name">Sun and Sand Hotel &nbsp;| Pune</div>
              <div class="event-date">Sat, 28th Feb 2026 | 3:30 pm</div>
            </div>

            <div class="price">₹2,859</div>
          </div>

          <!-- QR + ticket info column -->
          <div class="qr-col">
            <div class="qr-code">
              <!-- Replace src with actual QR asset path -->
              <img
                src="../assets/EMT/Rectangle 34628488.svg"
                alt="QR Code"
                onerror="
                  this.style.display = 'none';
                  this.parentElement.innerHTML =
                    '<svg viewBox=\'0 0 100 100\' xmlns=\'http://www.w3.org/2000/svg\' style=\'border:2px solid #111;\'><rect x=\'5\' y=\'5\' width=\'35\' height=\'35\' fill=\'none\' stroke=\'#111\' stroke-width=\'3\'/><rect x=\'12\' y=\'12\' width=\'21\' height=\'21\' fill=\'#111\'/><rect x=\'60\' y=\'5\' width=\'35\' height=\'35\' fill=\'none\' stroke=\'#111\' stroke-width=\'3\'/><rect x=\'67\' y=\'12\' width=\'21\' height=\'21\' fill=\'#111\'/><rect x=\'5\' y=\'60\' width=\'35\' height=\'35\' fill=\'none\' stroke=\'#111\' stroke-width=\'3\'/><rect x=\'12\' y=\'67\' width=\'21\' height=\'21\' fill=\'#111\'/><rect x=\'45\' y=\'45\' width=\'7\' height=\'7\' fill=\'#111\'/><rect x=\'55\' y=\'45\' width=\'7\' height=\'7\' fill=\'#111\'/><rect x=\'65\' y=\'45\' width=\'7\' height=\'7\' fill=\'#111\'/><rect x=\'45\' y=\'55\' width=\'7\' height=\'7\' fill=\'#111\'/><rect x=\'65\' y=\'55\' width=\'7\' height=\'7\' fill=\'#111\'/><rect x=\'45\' y=\'65\' width=\'7\' height=\'7\' fill=\'#111\'/><rect x=\'55\' y=\'65\' width=\'7\' height=\'7\' fill=\'#111\'/><rect x=\'75\' y=\'55\' width=\'7\' height=\'7\' fill=\'#111\'/><rect x=\'75\' y=\'65\' width=\'7\' height=\'7\' fill=\'#111\'/><rect x=\'85\' y=\'55\' width=\'7\' height=\'7\' fill=\'#111\'/><rect x=\'85\' y=\'75\' width=\'7\' height=\'7\' fill=\'#111\'/><rect x=\'55\' y=\'75\' width=\'7\' height=\'7\' fill=\'#111\'/><rect x=\'65\' y=\'85\' width=\'7\' height=\'7\' fill=\'#111\'/><rect x=\'75\' y=\'85\' width=\'7\' height=\'7\' fill=\'#111\'/></svg>';
                "
              />
            </div>

            <div class="ticket-info">
              <div class="ticket-count">2 Tickets</div>
              <div class="ticket-id">#75896940048476366373</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
