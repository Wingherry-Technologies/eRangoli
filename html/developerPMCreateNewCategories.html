<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Developer PM Create New Categories</title>
    <link rel="stylesheet" href="../css/developerPMCreateNewCategories.css" />
    <link
      rel="shortcut icon"
      href="../assets/master/eRangoli 2-1.svg"
      type="image/x-icon"
    />
  </head>
  <body>
    <!-- CREATE CATEGORY SCREEN -->
    <div class="create-category-screen" id="createCategoryScreen">
      <div class="create-header">
        <span class="back-btn" id="backToList"
          ><img src="../assets/adminProductCategories/back.svg"
        /></span>
        <h3>Create New Category</h3>
      </div>
      <div class="card-title">Create New Category</div>

      <div class="create-category-layout">
        <!-- LEFT SIDE FORM -->
        <div class="create-form">
          <label>Category Name *</label>
          <input type="text" id="categoryName" placeholder="Handloom" />
          <div class="error" id="categorynameError"></div>
          <div class="upload-container">
            <p class="upload-title">Upload Category Icon</p>

            <label class="upload-box">
              <input type="file" hidden />
              <img
                src="../assets/adminProductCategories/upload.svg"
                alt="upload"
              />
            </label>
            <div class="error imageError"></div>
          </div>

          <label>Sub - Category Name *</label>
          <input type="text" id="subCategoryName" placeholder="Saree" />
          <div class="error" id="subcategorynameError"></div>
          <div class="upload-container">
            <p class="upload-title">Upload Sub-Category Icon</p>

            <label class="upload-box">
              <input type="file" hidden />
              <img
                src="../assets/adminProductCategories/upload.svg"
                alt="upload"
              />
            </label>
            <div class="error imageError"></div>
          </div>

          <label>Sub - Sub- Category Name (if applicable)</label>
          <input type="text" placeholder="Enter Name" />
          <div class="upload-container">
            <p class="upload-title">Upload Sub-Sub Category Icon</p>

            <label class="upload-box">
              <input type="file" hidden />
              <img
                src="../assets/adminProductCategories/upload.svg"
                alt="upload"
              />
            </label>
          </div>

          <div class="upload-container-res">
            <p class="upload-title-res">Upload Category Icon</p>

            <label class="upload-box-res">
              <input type="file" hidden />
              <img
                src="../assets/adminProductCategories/upload.svg"
                alt="upload"
              />
            </label>
          </div>

          <button type="button" class="create-submit">Create</button>
        </div>
      </div>
    </div>
    <script src="../javascript/developerPMCreateNewCategories.js"></script>
  </body>
</html>
