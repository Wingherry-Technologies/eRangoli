<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Coupon</title>

    <link rel="stylesheet" href="../css/adminSalesCreateNewCoupons.css" />
  </head>
  <body>
    <div class="page-wrapper">
      <div class="card">
        <!-- Header -->
        <div class="card-header">
          <h2>Create new discount</h2>
          <button class="create-btn">Create</button>
        </div>

        <div class="divider"></div>

        <!-- Form -->
        <div class="form-grid">
          <div class="form-group">
            <label>Enter Coupon Name</label>
            <input type="text" placeholder="Pongal Price drop" />
          </div>

          <div class="form-group">
            <label>Create Coupon Code</label>
            <input type="text" placeholder="Pongal 12567" />
          </div>

          <div class="form-group">
            <label>Enter Condition</label>
            <input type="text" placeholder="On min. purchase of ₹3995" />
          </div>

          <div class="form-group">
            <label>Enter Discount Amount</label>
            <input type="number" placeholder="500" />
          </div>

          <div class="form-group">
            <label>Select Catergory</label>
            <select>
              <option>Handloom</option>
            </select>
          </div>

          <div class="form-group">
            <label>Select Subcategory</label>
            <select>
              <option>Saree</option>
            </select>
          </div>

          <div class="form-group">
            <label>Select Start Date</label>
            <input type="date" />
          </div>

          <div class="form-group">
            <label>Select End Date</label>
            <input type="date" />
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
